server.port=8080

# H2 file stored inside project data directory for portability
spring.datasource.url=jdbc:h2:file:./data/h2/stocky;MODE=LEGACY;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.h2.console.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# System seed user (overridden by env vars if set)
stocky.system.username=admin
stocky.system.password=admin123

# JWT dev defaults (not for production)
jwt.secret=offline-dev-secret-key-please-change
jwt.expiration=86400000
jwt.issuer=offline-local

# Disable dev tools restart to simplify offline packaging
spring.devtools.restart.enabled=false

# Telemetry flags (consumed in frontend via environment build or backend if extended later)
telemetry.enabled=false